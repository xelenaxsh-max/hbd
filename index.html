<!DOCTYPE html>
<html lang="fa" dir="rtl">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Birthday Letter</title>

    <link rel="stylesheet" href="hbd.css">
</head>

<body>

<div class="firework left">
    <div class="rocket"></div>
    <div class="heart"></div>
</div>

<div class="firework right">
    <div class="rocket"></div>
    <div class="heart"></div>
</div>

    <section class="screen envelope-screen" id="home">

        <a href="#letter" class="envelope-link">

            <img
                src="KAYAN/envelope.png"
                class="envelope-image"
                alt="Envelope"
            >

        </a>

    </section>


    <section class="screen letter-screen" id="letter">

        <img
            src="KAYAN/0.jpg"
            class="letter-image"
            alt="Letter"
        >

        <a
            href="#final"
            class="couple-link"
        >

            <img
                src="KAYAN/1.png"
                class="couple-image"
                alt="Photo"
            >

        </a>

    </section>


    <section class="screen final-screen" id="final">

        <img
            src="KAYAN/1.jpg"
            class="final-image"
            alt="Birthday"
        >

    </section>


</body>

</html>
